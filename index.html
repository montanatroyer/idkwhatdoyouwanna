<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Don't Know What Do You Wanna-</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      padding: 3rem 2rem;
      overflow-x: hidden;
      position: relative;
    }

    .bg-questions {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-questions span {
      position: absolute;
      font-size: var(--size);
      top: var(--y);
      left: var(--x);
      color: rgba(255, 255, 255, 0.15);
      animation: pulse var(--dur) ease-in-out infinite;
      animation-delay: var(--delay);
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }

    .backplate {
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1.5rem 3rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      text-align: center;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .choice {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      padding: 1.5rem 4rem;
      transition: transform 0.3s ease;
    }

    .choice:hover {
      transform: scale(1.03);
    }

    .choice-label {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .choice-reveal {
      height: 0;
      opacity: 0;
      overflow: hidden;
      transition: height 0.4s ease, opacity 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice:hover .choice-reveal {
      height: 80px;
      opacity: 1;
    }

    .choice-reveal .emoji {
      font-size: 4rem;
    }

    .spacer-1 {
      flex: 0 0 15vh;
    }

    .spacer-2 {
      flex: 0 0 15vh;
    }
  </style>
</head>
<body>
  <div class="bg-questions" aria-hidden="true"></div>

  <div class="backplate">
    <h1>I Don't Know What Do You Wanna-</h1>
  </div>

  <div class="spacer-1"></div>

  <a href="https://cuisineatrandom.vercel.app" class="choice backplate">
    <span class="choice-label">Eat?</span>
    <div class="choice-reveal">
      <span class="emoji">🍽️</span>
    </div>
  </a>

  <div class="spacer-2"></div>

  <a href="https://activityatrandom.vercel.app" class="choice backplate">
    <span class="choice-label">Do?</span>
    <div class="choice-reveal">
      <span class="emoji">🎯</span>
    </div>
  </a>

  <script>
    const container = document.querySelector('.bg-questions');
    const count = 20;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      span.textContent = '?';
      span.style.setProperty('--x', Math.random() * 100 + '%');
      span.style.setProperty('--y', Math.random() * 100 + '%');
      span.style.setProperty('--size', (2 + Math.random() * 6) + 'rem');
      span.style.setProperty('--dur', (3 + Math.random() * 4) + 's');
      span.style.setProperty('--delay', (Math.random() * -5) + 's');
      container.appendChild(span);
    }
  </script>
</body>
</html>
